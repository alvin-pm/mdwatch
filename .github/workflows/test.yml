name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 외부 의존성 없음(marked 인라인 번들) → install 불필요.
      # 인자 없는 --test = 자동 탐색(디렉토리 인자 처리는 Node 버전마다 다름)
      - run: node --test
